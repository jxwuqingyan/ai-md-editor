<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 圆角方形背景（accent 蓝） -->
  <rect width="1024" height="1024" rx="220" fill="#2563eb"/>
  <!-- Markdown 风格的下箭头 + 文字符号：简洁的白色「M」字标 -->
  <text x="512" y="700" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif"
        font-size="600" font-weight="700" fill="#ffffff"
        text-anchor="middle" dominant-baseline="middle">M</text>
</svg>
