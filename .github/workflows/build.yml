name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 关键：显式声明写权限，否则 GITHUB_TOKEN 为只读，创建 Release 会 403
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x64（Intel）—— macos-13 已弃用（2025-12 下线），改用 macos-15-intel
          - os: macos-15-intel
            arch: x64
            target: mac
          # macOS arm64（Apple Silicon）
          - os: macos-14
            arch: arm64
            target: mac
          # Windows x64
          - os: windows-latest
            arch: x64
            target: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # npm 包从官方 registry 下载（package-lock 已指向 npmjs）；
        # Electron 二进制单独走国内镜像加速，避免下载超时
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci

      - name: 确保 7zip-bin 二进制存在
        # npm ci 偶发漏装 7zip-bin 的平台二进制（7za），导致 electron-builder 打包时报
        # "ENOENT ... chmod '.../node_modules/7zip-bin/.../7za'"。
        # 本地 npm install 正常，仅 CI 的 npm ci 会中招，故此处兜底重装并赋予执行权限。
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            BIN="node_modules/7zip-bin/mac/${{ matrix.arch }}/7za"
          else
            BIN="node_modules/7zip-bin/win/${{ matrix.arch }}/7za.exe"
          fi
          if [ ! -f "$BIN" ]; then
            echo "7zip-bin 二进制缺失，重装..."
            rm -rf node_modules/7zip-bin
            npm install --no-save 7zip-bin
          fi
          chmod -R +x node_modules/7zip-bin 2>/dev/null || true

      - name: 构建渲染/主进程产物
        run: npm run build

      - name: 打包（macOS）
        if: matrix.target == 'mac'
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # macOS 打包跳过签名（无证书），否则 CI 会失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd apps/desktop
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: 打包（Windows）
        if: matrix.target == 'win'
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # Windows 打包跳过签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd apps/desktop
          npx electron-builder --win --${{ matrix.arch }} --publish never

      # artifact 上传为尽力而为：账户存储配额打满时会失败，但不影响 Release 发布
      # （Release 附件不占用 Actions artifact 存储配额，二者相互独立）
      - name: 上传产物（尽力而为）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: markdownnote-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: warn

      # 打 tag 时直接把安装包上传到 GitHub Release（不依赖 artifact，绕开存储配额）。
      # 注意：需要仓库 GITHUB_TOKEN 具备写 Release 权限（Settings → Actions →
      # General → Workflow permissions → 选 "Read and write permissions"），否则报 403。
      - name: 上传安装包到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          draft: false
          generate_release_notes: true
